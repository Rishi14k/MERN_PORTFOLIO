<!doctype html>
<html lang="en">
  <head>
    <!-- Basic -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rishi | MERN Stack Developer Portfolio</title>

    <!-- Primary SEO -->
    <meta
      name="description"
      content="MERN Stack Developer portfolio showcasing modern web projects, interactive UI, React, Node.js, MongoDB, and real-world applications."
    />
    <meta
      name="keywords"
      content="MERN Stack Developer, React Developer, Full Stack Developer, JavaScript, Portfolio"
    />
    <meta name="author" content="Rishi" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/me.png" />

    <!-- Open Graph (LinkedIn, WhatsApp, Facebook) -->
    <meta property="og:title" content="Rishi | MERN Stack Developer Portfolio" />

      property="og:description"
      content="Explore my MERN Stack projects, modern UI designs, and real-world web applications."

    <meta property="og:type" content="website" />

    <meta property="og:image" content="https://yourdomain.com/preview.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />

      name="twitter:title"
      content="Rishi | MERN Stack Developer Portfolio"
    />
    <meta
      name="twitter:description"
      content="Modern MERN Stack portfolio with interactive UI and real projects."
    />
    <meta name="twitter:image" content="https://yourdomain.com/preview.png" />

    <!-- Theme color (mobile browser UI) -->
    <meta name="theme-color" content="#0f172a" />
    

    <!-- App -->
